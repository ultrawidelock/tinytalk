# Link-time optimisation for the door-lock sample. Add it with
#   -DEXTRA_CONF_FILE="overlay-thread.conf;overlay-lto.conf"
#
# CARRIED FROM THE SOURCE PROJECT (see NOTICE), where it applied by default to
# every Matter over Thread image. Its numbers were measured there.
#
# BOTH LINES ARE REQUIRED, and this is the trap worth knowing. `CONFIG_LTO=y` on
# its own is a silent no-op: the symbol depends on
#   !(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION
# (zephyr/Kconfig.zephyr:526-528). With that dependency unmet Kconfig does not
# merely leave LTO off, it drops the symbol from the generated .config entirely,
# and emits no warning while doing it. Never trust a size number from this
# overlay without grepping the build's zephyr/.config for BOTH symbols.
#
# WHY IT WAS GATED, and what cleared the gate. LTO is whole-program codegen on
# an image whose UWB ranging path has a ~1836 us arm deadline, and a smaller
# binary is no evidence whatever that the deadline still holds. The only check
# that could prove it is a walk-up unlock on hardware.
#
# That ran 2026-08-02 on the debug image (405,296 B flash, 123,752 B RAM): two
# grants, a relock at 336 cm once past the 250 cm departure gate, a re-grant on
# the return leg at 45 cm, and 604 RX with the STS live throughout. Distance
# tracked unbroken from 1 cm to 584 cm and back. Re-run that walk-up after any
# change that could move the ranging path, not just after changes to this file.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y

# CONFIG_SIZE_OPTIMIZATIONS_AGGRESSIVE (-Oz) is NOT set, and that is a
# measured dead end rather than an oversight: tried 2026-08-22 on the
# debug+client image at 467b9f3a, it produced a binary exactly 1 byte
# smaller than -Os. On this GCC (12.2, arm-zephyr-eabi) -Oz's cost-model
# changes are almost entirely x86-side, so under LTO the two levels are the
# same codegen here. -flto-partition=one was measured in the same session
# and bought nothing attributable either. Do not re-spend a build on them.

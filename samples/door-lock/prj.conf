# tinymatter door-lock sample: a Matter Door Lock on an nRF52833, commissioned
# over BLE. overlay-thread.conf adds Thread; overlay-lto.conf adds link-time
# optimisation.
#
# CARRIED FROM THE SOURCE PROJECT (see NOTICE). The trims below and their
# comments come from its DWM3001CDK image: a credential reader, UWB ranging and
# a Matter node on the same nRF52833. Every number in them was measured there,
# on that image and on the date given, not on this sample; this sample's own
# sizes are in README.md. Where a comment talks about the reader, the
# credential channel, the UWB radio, MCUboot or firmware updates, it is
# describing that image.

# ---- tinymatter -----------------------------------------------------------
CONFIG_TINYMATTER_BLE=y
CONFIG_GPIO=y
# The factory-reset press reboots.
CONFIG_REBOOT=y
# The fabric store and OpenThread keep their state in settings, on NVS.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
# The source image's main and system work queue stacks.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# ---- carried: size ------------------------------------------------------------
CONFIG_SIZE_OPTIMIZATIONS=y
# Not carried: lines 10-14 set CONFIG_MCUBOOT_EXTRA_IMGTOOL_ARGS, which only
# exists in an image built with MCUboot. This sample builds without one.

# ---- carried: BLE ---------------------------------------------------------
CONFIG_BT_CENTRAL=n
CONFIG_BT_OBSERVER=n
CONFIG_BT_BROADCASTER=y
# TWO SLOTS, NOT ONE, AND THE SECOND ONE IS THE UPDATE PATH.
#
# With a single slot the arithmetic is brutal and was not noticed until a board
# was in front of a browser: a connectable advertisement with no free slot would
# be a lie, so the port correctly stops advertising the moment anything connects
# -- and a board that is not advertising is not merely slow to find from Web
# Bluetooth, it is INVISIBLE. requestDevice() shows an empty chooser forever.
#
# So a lock doing its job, with a phone holding the link, could never be updated
# over the air. The one state in which an update is most wanted -- a deployed,
# in-use lock -- was the one state that excluded it. That is not a browser
# limitation and no amount of page work could have reached it.
#
# MEASURED on the bench 2026-08-27 by reading the port's own flags over SWD:
# s_conn_up=1, s_adv_running=0, steady, on a board that was powered, working and
# answering over its cable in the same minute.
#
# MEASURED COST, same tree, this symbol and the port's slot counting the only
# levers, thread+release+smp+lto:
#
#   one slot    406,468 B flash   118,776 B RAM (90.62%)
#   two slots   406,468 B flash   121,728 B RAM (92.87%)
#   cost              +0 B            +2,952 B
#
# That leaves 9,344 B of RAM free, which is the tightest this image has run in
# the shipping configuration -- though not the tightest recorded: the +client
# baseline in size-baseline.json already sits at 93.73%. Worth knowing before
# adding the next thing that wants RAM.
#
# The second slot costs RAM and buys the property the flasher page promises. It
# does NOT weaken anything: BT_MAX_PAIRED stays 0, nothing gains a security
# level, and the L2CAP server and GATT permissions are untouched. Two peers can
# now be connected at once, which is what lets an update happen next to a phone
# rather than instead of one.
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=0
# SMP is compiled in only because Zephyr makes L2CAP CoC depend on it
# (zephyr/subsys/bluetooth/host/Kconfig.l2cap:49) — NimBLE does not, which is
# why the ESP32 port never needed this. It is never exercised: the GATT
# characteristics carry no _ENC/_AUTHEN permission, the L2CAP server sits at
# BT_SECURITY_L1, and nothing calls bt_conn_set_security. So the reader still
# never asks a phone to pair, which is the property the live-iPhone unlock
# depends on. Costed at stage 0 rather than assumed away.
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=n
CONFIG_BT_SIGNING=n
CONFIG_BT_GATT_CACHING=n
# The 0xFFF6 commissioning service is registered and withdrawn at runtime so
# the GATT table matches the advert -- see matter_ble_publish(). That is the
# only dynamic service on the board; everything else stays static.
#
# NOT A TIDINESS CHANGE. macOS refuses third-party descriptor discovery on the
# Matter UUIDs, Chromium's macOS backend never completes discovery after that
# error, and so a published 0xFFF6 costs this board every Web Bluetooth client
# on that host -- SMP firmware updates over the air included.
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DEVICE_NAME="tinymatter"

# Observe what the controller and peer actually negotiated. USER_* exposes the
# callbacks; stating AUTO_DATA_LEN_UPDATE keeps Zephyr's prior automatic DLE
# policy after USER_DATA_LEN_UPDATE is enabled. Shipping still requests no PHY
# change and keeps the controller data-length maximum at its 27-byte default;
# the 2M and 251-byte experiments live only in bench overlays.
CONFIG_BT_USER_DATA_LEN_UPDATE=y
CONFIG_BT_AUTO_DATA_LEN_UPDATE=y
CONFIG_BT_USER_PHY_UPDATE=y

# Connection interval: ask for 15-30 ms instead of riding whatever iOS picks.
#
# Every BLE flow on this board is round-trip bound, and one of them pays triple:
# the 255 B ACL buffer below splits a 512 B credential APDU across three PDUs, so an
# APDU costs up to three connection events in each direction. BTP fragments,
# CoC APDUs and DFU chunks all scale straight off the interval.
#
# This is Kconfig rather than a bt_conn_le_param_update() call BECAUSE of how
# the Zephyr peripheral works: that call does NOT send anything while the
# post-connect timer is still pending (host/conn.c:3786) -- it only stores the
# parameters for the timer to use. The request goes out when
# BT_CONN_PARAM_UPDATE_TIMEOUT fires, so the timeout IS the lever, and the PREF
# values are what gets sent. Adding a call site would have changed nothing.
#
# 300 ms rather than the stock 5,000: the whole walk-up transaction is ~650 ms,
# so a request at 5 s arrives after every flow it could have helped. The link
# layer needs >= 6 connection events of instant delay anyway, so the faster
# interval lands mid-transaction, not at its start.
#
# 12/24/0/200 = 15-30 ms, no latency, 2 s supervision. Valid per
# hci_core.c:1947-1960 and inside Apple's accessory guideline (min >= 15 ms,
# max >= min + 15 ms).
#
# MEASURED, and the reason the window is back to 12-24 rather than something
# cleverer: this iPhone grants 30 ms whatever it is asked for. Both 12-24 and
# 12-18 (a range whose only multiple of 15 ms is 15) came back as
# "interval 30.00 ms, latency 0, timeout 2000 ms" on 2026-08-06, on the
# commissioning link and again on the walk-up link. It honours the latency and
# the supervision timeout and picks the interval itself, so 30 ms is this
# phone's floor for this accessory and not a thing this end can bargain over.
# What survives is worth keeping -- 2 s of supervision instead of Zephyr's
# 420 ms default, and a request that arrives in time to matter if any other
# central (Android, a Home Assistant host, a controller doing DFU) does grant
# it -- but do not expect a faster walk-up from this knob on iOS.
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=300
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=24
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200

# L2CAP CoC carries the credential transaction. 512-byte SDUs match the ESP port.
CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y
CONFIG_BT_L2CAP_TX_MTU=512
# Sized for a PDU, not an SDU. The host's HCI receive pool is UNIFIED and gives
# every buffer the largest of the ACL and event sizes (buf.h:165, buf.h:175), so
# a 527 B ACL buffer made all twelve cost 527 B: 6,384 B measured in .bss for a
# geometry only one of them needed. Nothing here reassembles into that pool --
# coc_alloc_buf() hands the host an s_coc_rx_pool buffer of its own and Zephyr
# builds the SDU there. At 255 the MPS falls to ~251, a 512 B SDU rides three
# PDUs instead of one, and the pool costs 3,060 B. The price is two extra
# connection events per credential APDU, which is nothing against a walk-up. BTP is
# untouched: it rides GATT at an ATT MTU of 247, which still fits one PDU.
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
# NOT raised, and worth a line so it is not tried again. CONFIG_BT_BUF_EVT_RX_SIZE
# cannot change what the controller checks: hci_driver.c compares against
# HCI_RX_BUF_SIZE = BT_BUF_RX_SIZE = MAX(ACL_RX_SIZE + 4, EVT_RX_SIZE + 2), which
# the 255 above already fixes at 259. Measured: raising it to 255 moved nothing
# and cost 752 B of RAM, a quarter of what this image has left.
CONFIG_BT_EATT=n


# ---- crypto -----------------------------------------------------------------
# nRF52833 has no CryptoCell, so PSA lands on the software nrf_oberon backend.
# That is a speed and flash cost, not a blocker. Same PSA_WANT set the nRF5340
# on-target EC self-test proved in the source project, on an nRF5340.
CONFIG_NRF_SECURITY=y
CONFIG_MBEDTLS_PSA_CRYPTO_C=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
# MEASURED, not argued. 16384 was a guess carried from the ESP port and it was
# the largest single object in .bss. With the source's heap probe the peak across boot,
# PASE and a full CASE handshake is 228 B in 11 blocks -- reproduced on two
# independent runs, the second on a fully erased board with a new SRP key and a
# new node id. The help for that probe predicted this: the build
# is OBERON_ONLY_PSA_ENABLED with no MBEDTLS_BIGNUM_C or ECP_C, so ECDH and
# ECDSA run in driver stack buffers and only PSA key-slot material is ever
# mbedtls_calloc'd.
#
# 1024 kept 4.5x the measured peak, and it was not a fresh guess: the reader
# build was rebuilt at exactly that value and a live iPhone still unlocked, on a
# fresh session, for a saving of 15,360 B. CASE's own peak is 380 B, measured by
# the source's CASE bench, so 1024 covered both users of this heap with room over.
#
# This line used to carry a caution -- "NOT cut to peak+2048: the one path this
# image cannot exercise is a credential unlock, because a Matter build carries no
# reader identity". That premise expired on 2026-08-02, when Apple Home began
# provisioning the reader itself and this image started doing full walk-up
# unlocks. The path the caution was about is now exercised by the very walk-up
# that validates every other RAM change, which is what makes the cut checkable
# rather than merely argued.
#
# 512 WAS TRIED ON 2026-08-03 AND BROKE MATTER OVER THREAD. Do not try it again
# without reading this, because the argument for it looks airtight and the
# failure lands nowhere near the heap.
#
# The 228 B peak above is real and was never wrong. What it does not cover is
# the one allocation this image makes rarely and cannot do without: creating a
# PERSISTENT PSA key. OpenThread's SRP client does exactly that -- this build
# has OPENTHREAD_CONFIG_PLATFORM_KEY_REFERENCES_ENABLE=1, so its ECDSA key is
# generated at PSA_KEY_LIFETIME_PERSISTENT (crypto_psa.c:591), which serialises
# the key, seals it with ChaCha20-Poly1305 and writes it through
# trusted_storage. None of that runs on the boot, PASE or CASE paths the 228 B
# was measured across, and none of it runs for a volatile key.
#
# MEASURED by the source's SRP signing self-test: at 512 a volatile
# P-256 deterministic-ECDSA key generates, exports, imports and signs perfectly,
# and the identical sequence at persistent lifetime fails inside psa_generate_key
# with psa_status=-141, PSA_ERROR_INSUFFICIENT_MEMORY. Two log lines apart, same
# boot.
#
# WHAT IT LOOKS LIKE WHEN IT BREAKS, because it looks like anything but this.
# The board commissions over BLE, completes PASE, accepts AddNOC, attaches to
# Thread as a child and gets an off-mesh address -- and then never registers its
# name. OpenThread reports one value for it, kErrorFailed, which
# crypto_psa.c:22-34 maps every PSA error onto except two, and which
# dns_types.cpp:52-100 ALSO produces from a server SERVFAIL. So the log says
# "SRP registration FAILED (1) -- the commissioner cannot resolve this node",
# every finger points at the border router, and an afternoon goes into the
# network before anyone suspects a RAM constant.
CONFIG_MBEDTLS_HEAP_SIZE=1024

# PSA PERSISTENT-KEY STORAGE MUST STAY ON. Do not cut it, and here is the
# receipt, because the argument for cutting it is convincing and wrong.
#
# The argument: this image's PSA_WANT list above names no ChaCha, yet the build
# links a whole ChaCha20-Poly1305 -- MEASURED from the map, ocrypto_chacha20
# 874 B + ocrypto_poly1305 1,250 B + ocrypto_chacha20_poly1305 762 B = 2,886 B,
# before the ITS glue on top. It arrives because MBEDTLS_PSA_CRYPTO_STORAGE_C
# pulls in TRUSTED_STORAGE, whose AEAD backend has exactly one cipher choice
# (nrf/subsys/trusted_storage/Kconfig:84-98, no AES-GCM alternative to switch
# to). And nothing in modules/ or apps/dwm3001cdk-lock/src calls psa_set_key_id() or asks
# for PSA_KEY_LIFETIME_PERSISTENT: the reader identity and the Matter fabrics
# are settings-store data owned by the source's provisioning store and
# matter_fab_settings.c, not by PSA. Total saving, measured: 6,480 B of flash.
#
# Why it is wrong: OPENTHREAD_CRYPTO_PSA=y, so OpenThread's own platform glue
# is the caller this tree cannot see. zephyr/modules/openthread/platform/
# crypto_psa.c:180 imports keys at PSA_KEY_LIFETIME_PERSISTENT, and :591
# generates the SRP ECDSA key that way UNCONDITIONALLY. With the storage gone
# they cannot succeed, and the node cannot hold a network key. Which
# psa_status_t comes back was NOT measured -- the failure below logs no status
# at all -- so do not quote one; the call sites are the evidence.
#
# The failure does not look like a crypto failure. MEASURED 2026-08-03: PASE
# completed, AddNOC returned status 0, the 107 B dataset was accepted, and then
# "Thread still detached after 20000 ms" with the commissioner giving up on the
# BLE link 18 s in. Nothing logged an error, because every layer that could
# have was upstream of the one that failed.
#
# Grep workspace/ before calling a PSA lifetime unused here. The tracked tree is
# not the whole caller set, and this cost a commissioning round to learn.

CONFIG_PSA_WANT_ALG_ECDSA=y
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_DERIVE=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_PUBLIC_KEY=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_ALG_SHA_256=y
# No PSA_WANT_ALG_HKDF here on purpose. It depends on PSA_WANT_ALG_HMAC, which
# this image does not enable, so assigning it only produced a Kconfig warning
# and the value n -- psa_key_derivation_setup() returns PSA_ERROR_NOT_SUPPORTED.
# Nothing missed it: key derivation goes through tm_hkdf()
# (src/tm_hash.c), pure C11 and already linked. Turning the
# PSA one on would cost flash for a second implementation of RFC 5869.
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_GCM=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_GENERATE_RANDOM=y

# ---- carried: what is deliberately absent, and logging --------------------
# Not carried from lines 322-337: CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT,
# CONFIG_SHELL_LOG_BACKEND, CONFIG_SHELL_HISTORY and the source's UWB shell
# switch. They trim a USB console and a shell this sample does not build, and an
# assignment whose dependency is unmet aborts the build.
# ---- what is deliberately absent --------------------------------------------
# Console stays on, but over RTT rather than UART (see logging below).
CONFIG_UART_CONSOLE=n
# MCUboot IS built, and this file no longer decides that: sysbuild.conf does,
# through SB_CONFIG_BOOTLOADER_MCUBOOT. Sysbuild pushes the answer down onto
# this image itself (zephyr/share/sysbuild/image_configurations/
# MAIN_image_default.cmake:8 calls set_config_bool on CONFIG_BOOTLOADER_MCUBOOT),
# and that assignment is applied AFTER prj.conf -- so a `=n` here would not win,
# it would just make this file lie about the image it describes.
#
# What it used to say, kept because the mechanism is still true and still the
# thing that surprises people: CONFIG_BOOTLOADER_MCUBOOT is what produces the
# flash map, not the DTS. With it off, Partition Manager gave `app`
# 0x0..0x7e000 (504 KB) and ignored the 224 KB dual-slot layout in the board
# DTS entirely. With it on, PM builds a bootloader map instead -- and because
# `app` no longer starts at 0 and must not swallow settings_storage, the map is
# now PINNED in pm_static.yml rather than derived. See that file for the sizes
# and boards/decawave_dwm3001cdk.overlay for why the DTS partition nodes remain
# inert either way.
#
# The application still has no SMP server: recovery lives in the bootloader,
# reachable at boot over the J-Link VCOM, and an operational image that also
# spoke mcumgr would be a second write path into its own flash for no gain.
CONFIG_MCUMGR=n

# ---- logging ----------------------------------------------------------------
# RTT, not UART: the delayed-TX reply window on this single-core part cannot
# afford a blocking console write. Minimal mode drops the deferred-logging
# machinery, which is the part that actually costs flash.
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
# Three of Zephyr's own modules below that default, because what they print is
# not about this lock and every image here is within a few hundred bytes of
# its slot. The Bluetooth host's INFO lines are its boot banner (controller
# build, HCI and LMP versions, identity); its warnings and errors stay. The I2C
# and sensor drivers only ever speak for the LIS2DH12, and the line that
# matters about it is the application's own "no impact sensor; tamper
# detection is off". MEASURED 2026-10-04 on the two-anchor image at main
# 2748b66a: 433,432 B to 431,268 B, 2,164 B back. That is what let the
# credential-status fix and the document dates in (about 1.3 KiB together).
# Not carried: CONFIG_I2C_LOG_LEVEL_OFF and CONFIG_SENSOR_LOG_LEVEL_OFF. This
# sample builds no I2C or sensor driver, so they have nothing to trim.
CONFIG_BT_LOG_LEVEL_WRN=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
# 8 KB up-buffer, not the 1 KB default. RTT is this board's ONLY console, and
# the default policy is NO_BLOCK_SKIP: once the buffer fills, writes are
# silently DISCARDED. Boot output here exceeds 1 KB, so the default truncates
# mid-line and looks exactly like a hang -- it cost a debugging detour to learn.
# Deliberately not BLOCK_IF_FIFO_FULL: that never drops a byte, but it stalls
# the firmware forever when no debugger is draining the buffer.
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=8192

# Thread for the door-lock sample: an OpenThread MTD beside BLE.
#
# Build with:
#   west build -b decawave_dwm3001cdk samples/door-lock -- \
#     -DEXTRA_CONF_FILE=overlay-thread.conf
#
# CARRIED FROM THE SOURCE PROJECT (see NOTICE), comments included. Every number
# below was measured there, on its reader + Matter image, on the date given;
# this sample's own sizes are in README.md.

CONFIG_TINYMATTER_THREAD=y

# MEASURED in the source project on nRF52833, reader + five-fabric Matter node +
# Thread MTD, SMP=1 RELEASE=1, 2026-08-16, from the linker's own region report:
#
#   flash      397,360 B   91.63% of the 433,664 B app region;  36,304 B free
#   RAM        120,740 B   92.12% of 131,072 B;                 10,332 B free
#
# The standalone-OpenThread optimization that introduced this overlay measured:
#
#   417,308 / 121,236   the L2 image at LOG_DEFAULT_LEVEL=3  (flash bound, 96.23%)
#   396,740 / 121,044   errors-only logging                  (flash bound, 91.49%)
#   379,356 / 111,012   standalone OpenThread, 2026-08-04    (RAM bound, 84.70%)
#
# Standalone OpenThread is worth 17,384 B of flash and 10,032 B of RAM against
# that historical middle row. The RAM half was the interesting one: 4,540 B of it is named
# .bss pools that simply stopped existing (see the reclamation section below),
# and the rest is the L2's own thread, net_if state and neighbour tables.
#
# The figure that stood here for a long time was 415,416 B / 80.5% against a
# 516,096 B slot. Both halves of that are now wrong: the slot shrank when
# MCUboot arrived, and the image had already grown ~29 KB past 415,416 B before
# it did. It was measured on a smaller tree and was never updated, which cost a
# planning round -- 80% and 92% are different decisions. Re-measure from the
# linker's own region report, not from this comment: the exact figures above
# move by roughly a kilobyte on every merge into this branch, so treat them as
# a snapshot with a date, not as a fact about the code.

# ---- the stack ------------------------------------------------------------
#
# STANDALONE OpenThread, not NET_L2_OPENTHREAD. The L2 exists to carry Zephyr's
# IPv6 stack over a Thread interface, and this node never asks it to: every
# datagram in and out of matter_thread_port.c goes through otUdpSend and an
# otUdpSocket receive callback, and CONFIG_NET_SOCKETS has been n since the
# overlay was written. The whole IP layer was being linked to serve nobody.
#
# What makes it work without the L2, verified in this NCS 3.3.0 workspace:
#   - nrf/modules/openthread/platform/CMakeLists.txt:22 selects radio_nrf5.c
#     with zephyr_library_sources_ifndef(CONFIG_NET_L2_OPENTHREAD), so the
#     radio driver is Nordic's own rather than the L2 adaptation layer.
#   - zephyr/modules/openthread/openthread.c provides openthread_run(),
#     openthread_mutex_lock/unlock() and openthread_get_default_instance(),
#     the only four Zephyr-side OT calls this firmware makes. The L2 header
#     marks its versions @deprecated in favour of exactly these.
#   - OPENTHREAD_SYS_INIT defaults y and depends on !NET_L2_OPENTHREAD, so the
#     stack still initialises; MANUAL_START below still governs when it joins.
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
# MED, not SED. This used to be CONFIG_OPENTHREAD_MTD_SED=y with
# CONFIG_OPENTHREAD_POLL_PERIOD=3000, and that pair was the single largest
# share of tile-tap latency and of commissioning's post-BLE tail: an SED
# receives a frame only when it polls, so every hub-to-node message -- each
# CASE sigma, every tile invoke, every subscription chunk ack -- waited a mean
# 1,500 ms, and the SII=3000 the node advertised alongside it paced every
# peer retransmit at 3.3 s or more.
#
# Keeping the receiver on is pre-cleared on this exact part: the Stage 0
# contention gate (src/thread_gate.c) deliberately ran MED on channel 15
# directly over BLE ch38 under ping load, and ranging survived. The board is
# USB-powered, so rx-on costs power nothing here pays for and buys latency.
#
# If a battery build ever needs SED back: CONFIG_OPENTHREAD_MTD_SED=y plus
# CONFIG_OPENTHREAD_POLL_PERIOD=500, and move the advertised SII with it --
# the SRP TXT record (ports/zephyr/thread/matter_thread_port.c) and the Sigma2
# session parameters (src/matter_case.c) describe this radio's
# availability to peers, and the three lie if they diverge.

# Matter over Thread registers its operational service with the border router
# over SRP, so this is not optional once CASE has to be reachable.
CONFIG_OPENTHREAD_SRP_CLIENT=y

# Stateless address autoconfiguration. Defaults OFF, and without it this node
# holds ONLY mesh-local and link-local addresses -- so a commissioner resolves
# its SRP name, gets an address that does not leave the Thread mesh, and hangs.
# Measured exactly that: attached as a child in 2,500 ms, then twenty seconds
# with no off-mesh-routable address, because SLAAC is what builds one from the
# prefix the border router publishes. Nothing about being ON a network makes a
# node REACHABLE on it.
CONFIG_OPENTHREAD_SLAAC=y

# Do NOT bring Thread up at boot. This node has no dataset until Apple sends
# one, and a stack that starts without credentials scans, fails, and retries
# for the whole commissioning window -- on a radio BLE is sharing.
# matter_thread_start() starts it, the moment there is something to start with.
CONFIG_OPENTHREAD_MANUAL_START=y

# 2048 here faults during the UNLOCK, immediately after SENT_AUTH0: the credential
# access protocol runs on this queue and its measured peak is 3,568 B. The trim
# was withdrawn once and came back in this overlay -- it cannot go below 4096.
#
# 4096 THEN FAULTED THE SAME WAY on 2026-08-02, same phase, same MPU stack
# guard, once Matter ran alongside the unlock: an operational node persists the
# trust store and services a subscription on this queue while the access
# protocol is mid-AUTH0, and 528 B of headroom did not cover the overlap.
# MEASURED 2026-08-02 from the stack paint, after a full-auth walk-up unlock on
# a commissioned node: PEAK 3,872 B of the 6,144 here, 2,272 B untouched.
# So 4096 was never comfortably right -- it left 224 B, and the two faults were
# that margin being spent by whatever else the queue was doing at the time.
# 6144 is kept rather than trimmed to ~5120 because the peak MOVES with what
# overlaps the unlock, and this is the stack that has already faulted twice.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=6144
CONFIG_MAIN_STACK_SIZE=4096

# TEMPORARY, for sizing the stack above. Paint only -- no analyzer thread.
#
# CONFIG_THREAD_ANALYZER_AUTO was the obvious way to read the peak and costs a
# thread and its stack, which took this image to 96.6% RAM against a 127,352 B
# figure already recorded as unrunnable. The paint is what the analyzer
# actually measures, and a debugger can read it straight out of RAM:
#
#   savebin stack.bin, <stack addr>, <size>   # addresses from zephyr.map
#   then count the leading 0xAA run; peak used = size - run
#
# So this keeps the fill, which costs nothing at runtime, and leaves the
# reading to the host. Drop CONFIG_INIT_STACKS once the number is settled.
CONFIG_INIT_STACKS=y

# The Matter Interaction Model runs on THIS stack. Datagrams arrive through the
# OpenThread UDP callback, so decrypt, decode, the cluster command, the response
# encode and the framing all happen on ot_work_q -- and at 3168 B (the NCS
# default) it overflowed at CommissioningComplete, twice, with both fabrics
# accepted and both CASE sessions up. "Stack overflow on CPU 0", a halt, and the
# phone reporting "transaction timed out" for a pairing that had in fact
# succeeded on the wire.
#
# Moving the NVS write off this thread was necessary and NOT sufficient: the IM
# path alone does not fit.
#
# MEASURED from the paint after a COMPLETE pairing -- two fabrics, two CASE
# sessions, a chunked subscription and both credentials: PEAK 3,072 B of
# the 4,096 here, 1,024 B untouched.
#
# So the 3168 default was not badly wrong, it was wrong by NINETY-SIX BYTES.
# That is the whole story of this fault: a margin thin enough that any variation
# in the path spends it, which is why the same firmware paired once and then
# halted twice in the same place. The system work queue earlier the same day was
# the same shape (3,872 B measured against 4,096 allowed). On this part a
# default is a starting point, not a size.
CONFIG_OPENTHREAD_THREAD_STACK_SIZE=4096

# ---- what is left out -----------------------------------------------------
#
# Zephyr's IP stack, entirely. This block used to read "sockets sit above UDP
# and a Matter node calling otUdp* never touches them; UDP itself has to stay,
# because connection.c compiles under NET_IPV6 and its CONFIG_NET_MAX_CONN
# depends on a transport". That was true while NET_L2_OPENTHREAD forced
# NETWORKING on. Dropping the L2 drops the premise: no NETWORKING, so no
# NET_IPV6, no NET_UDP, no NET_SOCKETS and no connection.c to satisfy. The
# symbols are not set to n here because without NETWORKING they do not exist,
# and assigning an undefined symbol is a Kconfig warning that reads like a
# setting and behaves like a comment.

# The source image's USB provisioning console was switched off here too; its
# symbol does not exist in this sample.
CONFIG_SHELL=n
CONFIG_USB_DEVICE_STACK=n
CONFIG_USB_CDC_ACM=n

# ---- RAM reclamation ------------------------------------------------------
#
# Zephyr's net buffers were trimmed here from the general-IP-routing defaults,
# worth 3,744 B while the L2 was carrying datagrams. Standalone OpenThread
# retires the pools outright rather than shrinking them: measured in the
# 2026-08-04 baseline ELF, net_buf_data_pkt_pool 1,024 + net_buf_data_rx_bufs
# 1,024 + net_buf_data_tx_bufs 1,024 + _k_mem_slab_buf_tx_pkts 832 +
# _k_mem_slab_buf_rx_pkts 624 + ipv6_addresses 588 + _net_buf_rx_bufs 224 +
# _net_buf_tx_bufs 224 = 5,564 B of .bss that no longer has an owner.
# OpenThread carries its own message pool and is unaffected.

# CONFIG_MBEDTLS_HEAP_SIZE was on this list as "do not touch, starving it
# breaks unlocks on a path nothing exercises". It has since been MEASURED at a
# 228 B peak and now sits at 1024 in prj.conf, which is where the argument
# should have started. The caution was right about the unlock path and wrong
# about the size: measure first, and the number settles it. It went 16384 ->
# 4096 -> 1024, each step against a measurement rather than a guess.
#
# DELIBERATELY NOT REDUCED:
#
#   OpenThread and net stacks     ~2,800 B, paid for with an MPU stack-guard
#                                 fault under load -- which on this board has
#                                 already once presented as a hang. Size these
#                                 from CONFIG_THREAD_ANALYZER_AUTO, never by
#                                 estimate; two stacks in this project were
#                                 guessed low and both faulted on hardware.
#   CONFIG_NRF_802154_RX_BUFFERS  default 20, 2,580 B measured (129 B each). A
#                                 1,024 B Sigma3 arrives as ~11-12 6LoWPAN
#                                 fragments, so cutting to 8 would leave less
#                                 than one CASE message of margin on a radio
#                                 the OT thread shares with BLE and the DW3110
#                                 ISR queue.
#   OPENTHREAD_NUM_MESSAGE_BUFFERS  IMPOSSIBLE, not merely unwise. NCS pins it
#                                 at `range 64 65535` for an MTD
#                                 (nrf/subsys/net/openthread/Kconfig.defconfig)
#                                 and 64 is already the effective value, so a
#                                 lower setting aborts the build.

# Two OpenThread modules nothing in this image calls, compiled in only because
# somebody else's default said yes: the NCS defconfig turns the ping sender on
# (nrf/subsys/net/openthread/Kconfig.defconfig:90) and OPENTHREAD_UPTIME
# defaults y for every MTD build. Both are ot::Instance members, so LTO and
# --gc-sections can never drop them on their own. 936 B of text measured dead
# at 467b9f3a: no caller for otPing* or otInstanceGetUptime* exists outside
# workspace/. Nothing observable changes -- neither has a log line to lose.
CONFIG_OPENTHREAD_PING_SENDER=n
CONFIG_OPENTHREAD_UPTIME=n

# Frame security in OpenThread's sub-MAC instead of inside the 802.15.4
# driver. Not a feature cut: OT_RADIO_CAPS_TRANSMIT_SEC is only ever a
# routing decision (ieee802154_nrf5.c:261 -> radio.c:1002), and the software
# path is ALREADY compiled into every one of these images --
# OPENTHREAD_MAC_SOFTWARE_TX_SECURITY_ENABLE=y above it. With the driver
# copy gone the same AES-CCM runs once instead of linking twice: 868 B of
# driver-side crypto measured at 467b9f3a. The price is software CCM ahead
# of each secured TX on the OT thread rather than in the radio ISR path,
# which an MTD sending data polls and the odd SRP update will not notice.
# Verify like any radio-path change: Thread must still attach and pass
# Stage 1 of the source project's Matter binding bench before this ships anywhere.
CONFIG_NRF_802154_ENCRYPTION=n
